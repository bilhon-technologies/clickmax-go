openapi: 3.1.1
paths:
  /whoami:
    get:
      operationId: whoami
      summary: Current identity
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        4XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /nodes/get:
    post:
      operationId: nodesGet
      summary: Get nodes
      description: Reads nodes. Find ids with `nodes_list` or `nodes_list({ kind })`, then call
        nodes_list again; `whoami` names the caller and `nodes_unknown` stays as written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodesGetInput"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
  /nodes/list:
    get:
      operationId: nodesList
      parameters:
        - in: query
          name: since
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: kind
          description: Filter by kind.
          schema:
            anyOf:
              - type: string
                enum: [leaf]
              - type: string
                enum: [branch]
        - in: query
          name: perPage
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodesListOutput"
components:
  schemas:
    ApiError:
      type: object
      properties:
        error: {type: string}
    NodesGetInput:
      type: object
      properties:
        ids:
          type: array
          items:
            type: [string, "null"]
        scores:
          type: object
          propertyNames: {type: string}
          additionalProperties:
            type: [number, "null"]
        clear:
          type: "null"
        extra:
          anyOf:
            - {}
            - type: "null"
        label:
          type: [string, "null"]
          description: Send null to clear the label.
        merged:
          allOf:
            - type: object
              properties:
                a: {type: string}
              required: [a]
            - type: object
              properties:
                b: {type: [integer, "null"]}
      required: [ids]
    Node:
      type: object
      properties:
        name: {type: string}
        createdAt:
          type: string
          format: date-time
        parent:
          $ref: "#/components/schemas/Node"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        sibling:
          anyOf:
            - $ref: "#/components/schemas/Node"
            - type: "null"
        status:
          type: string
          enum: [active, paused, null]
        tier:
          anyOf:
            - const: gold
            - const: silver
            - const: null
        button:
          description: A button is a link or a reply.
          anyOf:
            - type: object
              properties:
                type: {type: string, const: url}
                url: {type: string}
              required: [type, url]
            - type: object
              properties:
                type: {type: string, const: reply}
                text: {type: string}
              required: [type, text]
      required: [name, createdAt, parent, sibling]
    NodesListOutput:
      type: array
      items:
        type: object
        properties:
          id: {type: string}
        required: [id]
